[package]
name = "synced-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
synced-core = { path = "../synced-core" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
tray-icon = "0.19"
raw-window-handle = "0.6"
serde_json = "1.0"

[build-dependencies]
winres = "0.1"



