<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>synceD Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7bf1a8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v13M5 12l7 7 7-7"/>
            <path d="M4 21h16"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>synceD</h1>
          <span class="badge">INTEGRATION</span>
        </div>
      </div>
      <div id="status-pill" class="status-pill offline">
        <span class="status-dot"></span>
        <span id="status-text">OFFLINE</span>
      </div>
    </header>

    <main class="content">
      <div class="setting-card">
        <div class="setting-info">
          <span class="setting-title">Auto-Intercept Downloads</span>
          <span class="setting-desc">Forward all downloads directly into synceD</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="intercept-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="card">
        <label for="url-input" class="card-label">QUICK SEND LINK</label>
        <div class="input-row">
          <input type="text" id="url-input" placeholder="https://example.com/file.zip" spellcheck="false" autocomplete="off">
          <button id="send-btn" class="primary-btn">
            <span>Send</span>
          </button>
        </div>
        <div id="feedback" class="feedback"></div>
      </div>

      <div class="card settings-accordion">
        <div class="accordion-header" id="accordion-toggle">
          <span class="card-label">PORT CONFIGURATION</span>
          <span id="accordion-arrow" class="arrow">▾</span>
        </div>
        <div class="accordion-body" id="accordion-body">
          <div class="port-row">
            <span class="port-label">Local IPC Port:</span>
            <input type="number" id="port-input" value="17890" min="1024" max="65535">
            <button id="save-port-btn" class="secondary-btn">Save</button>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <span>High-Performance Segmented Engine</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
